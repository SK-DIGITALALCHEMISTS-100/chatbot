<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAG Technology ChatBot</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-container">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">

            🤖

            <h4>RAG Assistant</h4>

        </div>

        <button id="newChatBtn" class="new-chat">

            <i class="bi bi-plus-circle"></i>

            New Chat

        </button>

        <hr>

        <h6 class="history-title">

            <i class="bi bi-clock-history"></i>

            Search History

        </h6>

        <ul id="historyList" class="history-list">

        </ul>

    </aside>

    <!-- ================= Main Chat ================= -->

    <main class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div>

                <h2>

                    🤖 RAG Technology ChatBot

                </h2>

                <span class="status">

                    <i class="bi bi-circle-fill"></i>

                    Online

                </span>

            </div>

            <button id="resetBtn"
                    class="btn btn-danger">

                <i class="bi bi-trash"></i>

                Reset

            </button>

        </div>

        <!-- Chat Body -->

        <div id="chatBox"
             class="chat-body">

            <div class="message bot">

                <div class="avatar bot-avatar">

                    🤖

                </div>

                <div class="bot-message">

                    <h5>

                        Welcome 👋

                    </h5>

                    <p>

                        I am your RAG Technology Assistant.

                    </p>

                    <p>

                        Ask me anything about:

                    </p>

                    <ul>

                        <li>What is RAG?</li>

                        <li>Embeddings</li>

                        <li>Chunking</li>

                        <li>Vector Database</li>

                        <li>Hallucination</li>

                    </ul>

                    <small class="time">

                        Just now

                    </small>

                </div>

            </div>

        </div>

        <!-- Footer -->

        <div class="chat-footer">

            <input

                type="text"

                id="userInput"

                class="form-control"

                placeholder="Ask anything about RAG Technology...">

            <button

                id="sendBtn"

                class="btn btn-primary">

                <i class="bi bi-send-fill"></i>

            </button>

        </div>

    </main>

</div>

<!-- JavaScript -->

<script src="data.js"></script>

<script src="script.js"></script>

</body>

</html>
