<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAG ChatBot</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container py-4">

    <div class="chat-card">

        <!-- Header -->

        <div class="chat-header">

            <div>

                <h3>
                    <i class="bi bi-robot"></i>
                    RAG Technology ChatBot
                </h3>

                <p>
                    Ask anything about Retrieval-Augmented Generation
                </p>

            </div>

        </div>

        <!-- Chat Area -->

        <div id="chatBox"
             class="chat-body">

            <!-- Bot Welcome -->

            <div class="bot-message">

                👋 Hello!

                <br><br>

                I am a RAG Technology ChatBot.

                <br><br>

                Ask questions like:

                <ul>

                    <li>What is RAG?</li>

                    <li>Explain Chunking</li>

                    <li>What is Vector Database?</li>

                    <li>Tell me about Embeddings</li>

                    <li>What is Hallucination?</li>

                </ul>

            </div>

        </div>

        <!-- Input -->

        <div class="chat-footer">

            <input

                id="userInput"

                class="form-control"

                placeholder="Ask about RAG Technology...">

            <button

                id="sendBtn"

                class="btn btn-primary">

                <i class="bi bi-send-fill"></i>

            </button>

        </div>

    </div>

</div>

<script src="data.js"></script>

<script src="script.js"></script>

</body>

</html>
