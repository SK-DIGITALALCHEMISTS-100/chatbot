<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAG ChatBot</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container py-4">

    <div class="chat-card">

        <!-- Header -->

        <div class="chat-header">

    <div>
        <h3>
            🤖 RAG Technology ChatBot
        </h3>

        <p>
            Ask Anything About RAG Technology
        </p>
    </div>

    <div>

        <button
            id="historyBtn"
            class="btn btn-warning">

            <i class="bi bi-clock-history"></i>

            History

        </button>

        <button
            id="resetBtn"
            class="btn btn-danger">

            <i class="bi bi-trash"></i>

            Reset

        </button>

    </div>

</div>
<div id="historyPanel" class="history-panel">

    <h5>📜 Search History</h5>

    <ul id="historyList"></ul>

</div>

        <!-- Chat Area -->

        <div id="chatBox"
             class="chat-body">

            <!-- Bot Welcome -->

            <div class="bot-message">

                👋 Hello!

                <br><br>

                I am a RAG Technology ChatBot.

                <br><br>

                Ask questions like:

                <ul>

                    <li>What is RAG?</li>

                    <li>Explain Chunking</li>

                    <li>What is Vector Database?</li>

                    <li>Tell me about Embeddings</li>

                    <li>What is Hallucination?</li>

                </ul>

            </div>

        </div>

        <!-- Input -->

        <div class="chat-footer">

            <input

                id="userInput"

                class="form-control"

                placeholder="Ask about RAG Technology...">

            <button

                id="sendBtn"

                class="btn btn-primary">

                <i class="bi bi-send-fill"></i>

            </button>

        </div>

    </div>

</div>

<script src="data.js"></script>

<script src="script.js"></script>

</body>

</html>
